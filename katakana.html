<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hirakata</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="hira" data-kana="katakana"></div>
    <div class="min-h-screen flex justify-center items-center bg-gradient-to-r from-blue-800 to-purple-800 p-4">

        <!-- KARTU -->
        <div class="card hidden"></div>

        <!-- PILIHAN KATEGORI -->
        <div class="p-6 text-center text-xl wadah w-full max-w-xl">

            <h1 class="text-3xl md:text-4xl font-bold text-white text-center mb-6">
                SILAHKAN PILIH KATEGORI KATAKANA
            </h1>

            <!-- GOJUON -->
            <div
                class="grid grid-cols-5 gap-2 mb-4 *:bg-white *:rounded *:p-3 *:cursor-pointer *:active:scale-110 *:transition-transform">

                <div class="kelompok" data-category="basic" data-kelompok="a">ア</div>
                <div class="kelompok" data-category="basic" data-kelompok="ka">カ</div>
                <div class="kelompok" data-category="basic" data-kelompok="sa">サ</div>
                <div class="kelompok" data-category="basic" data-kelompok="ta">タ</div>
                <div class="kelompok" data-category="basic" data-kelompok="na">ナ</div>

                <div class="kelompok" data-category="basic" data-kelompok="ha">ハ</div>
                <div class="kelompok" data-category="basic" data-kelompok="ma">マ</div>
                <div class="kelompok" data-category="basic" data-kelompok="ya">ヤ</div>
                <div class="kelompok" data-category="basic" data-kelompok="ra">ラ</div>
                <div class="kelompok" data-category="basic" data-kelompok="wa">ワ</div>

            </div>

            <!-- DAKUTEN -->
            <div
                class="grid grid-cols-5 gap-2 mb-4 *:bg-white *:rounded *:p-3 *:cursor-pointer *:active:scale-110 *:transition-transform">

                <div class="kelompok" data-category="dakuten" data-kelompok="ga">ガ</div>
                <div class="kelompok" data-category="dakuten" data-kelompok="za">ザ</div>
                <div class="kelompok" data-category="dakuten" data-kelompok="da">ダ</div>
                <div class="kelompok" data-category="dakuten" data-kelompok="ba">バ</div>
                <div class="kelompok" data-category="dakuten" data-kelompok="pa">パ</div>

            </div>

            <!-- YOUON -->
            <div
                class="grid grid-cols-5 gap-2 *:bg-white *:rounded *:p-3 *:cursor-pointer *:active:scale-110 *:transition-transform">

                <div class="kelompok" data-category="yoon" data-kelompok="ki">キャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="syi">シャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="chi">チャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="nya">ニャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="hya">ヒャ</div>

                <div class="kelompok" data-category="yoon" data-kelompok="myu">ミャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="rya">リャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="gya">ギャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="ja">ジャ</div>
                <div class="kelompok" data-category="yoon" data-kelompok="bya">ビャ</div>

                <div class="kelompok" data-category="yoon" data-kelompok="pya">ピャ</div>
                <div class="kelompok" data-category="" data-kelompok="">Acak</div>

            </div>

        </div>

    </div>

    <script src="kana.js"></script>

</body>

</html>
