<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hirakata</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="flex justify-center items-center h-screen bg-gradient-to-r from-blue-800 to-purple-800">
        <container class="max-w-md p-6 flex flex-col">
            <h1 class="text-3xl font-bold text-white mb-4 text-center">FLASH CARD GAMES JAPANESE</h1>
            <button id="btn-hiragana" class="text-xl font-bold card bg-white p-4 rounded-lg text-center my-2 transition-transform active:scale-110">
                <div class="">HIRAGANA</div>
            </button>
            <button id="btn-katakana" class="text-xl font-bold card bg-white p-4 rounded-lg text-center my-2 transition-transform active:scale-110">
                <div class="">KATAKANA</div>
            </button>
            <button id="btn-kANJI" class="text-xl font-bold card bg-white p-4 rounded-lg text-center my-2 transition-transform active:scale-110">
                <div class="">KANJI DASAR <span class="text-gray-500 italic font-light">coming soon</span></div>
            </button>
            <button id="btn-kANJI-N5" class="text-xl font-bold card bg-white p-4 rounded-lg text-center my-2 transition-transform active:scale-110">
                <div class="">KANJI N5 <span class="text-gray-500 italic font-light">coming soon</span></div>
            </button>
            <button id="btn-kANJI-N4" class="text-xl font-bold card bg-white p-4 rounded-lg text-center my-2 transition-transform active:scale-110">
                <div class="">KANJI N4 <span class="text-gray-500 italic font-light">coming soon</span></div>
            </button>
            <p>Mari tingkatkan hafalanmu dengan lebih menyenangkan 😊</p>
        </container>
        
    </div>
</body>

</html>
